apiVersion: v1
kind: Service
metadata:
  name: platform-pulse
  namespace: platform-pulse
  labels:
    app.kubernetes.io/name: platform-pulse
    app.kubernetes.io/part-of: aws-devops-platform
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: platform-pulse

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http